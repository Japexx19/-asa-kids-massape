<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
    background:#0b2343;

}

    display:flex;

.card{
    display:block;

    border-radius:25px;

.disponivel{
color:green;
font-weight:bold;
}

button{

.cronometro{

button{

}

@keyframes piscar{

    50%{opacity:.3;}
    100%{opacity:1;}
}

.alerta{
    color:#dc2626 !important;
    animation:piscar .8s infinite;
}

</style>

<h2 style="text-align:center;color:#0b2343;">Histórico de Aluguéis</h2>

<table id="historico" style="width:95%;margin:20px auto;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.1);">

    <thead style="background:#0b2343;color:white;">
        <tr>
            <th>Triciclo</th>
            <th>Início</th>
            <th>Fim</th>
            <th>Tempo</th>
            <th>Valor</th>
        </tr>
    </thead>

    <tbody>

    </tbody>

</table>



<script>

let contadores = {};
let horariosInicio = {};
let fimContagem = {};
let tempoPausado = {};

let horariosContagem = {};

const alarme = new Audio("alarme.mp3");

function atualizarValor(numero){

    const minutos = document.getElementById("minutos"+numero).value;

    document.getElementById("valor"+numero).innerHTML =
    "<strong>Valor:</strong> R$ " + minutos + ",00";

}

function alugar(numero){

    clearInterval(contadores[numero]);

    const minutos = parseInt(
        document.getElementById("minutos"+numero).value
    );

    if(!fimContagem[numero]){

        fimContagem[numero] =
            Date.now() + (minutos * 60 * 1000);

    }

    let segundos = Math.ceil(
        (fimContagem[numero] - Date.now()) / 1000
    );

    if(segundos < 0){
        segundos = 0;
    }

document.getElementById("status"+numero).innerHTML="🔴 Alugado";
document.getElementById("status"+numero).className="alugado";
document.getElementById("card"+numero).className="card card-alugado";

if(!horariosInicio[numero]){

    const agora = new Date();

    horariosInicio[numero] = agora;
    horariosContagem[numero] = Date.now();

    document.getElementById("inicio"+numero).innerHTML =
    "🕒 Iniciado às " +
    agora.getHours().toString().padStart(2,"0")+":"+
    agora.getMinutes().toString().padStart(2,"0");

}

document.getElementById("btnIniciar"+numero).style.display="none";
document.getElementById("btnPausar"+numero).style.display="block";
document.getElementById("btnEncerrar"+numero).style.display="block";
document.getElementById("btnRetomar"+numero).style.display="none";
document.getElementById("tempo"+numero).style.display = "block";
document.getElementById("inicio"+numero).style.display = "block";
document.querySelectorAll("#card"+numero+" .linha")
    .forEach(linha => linha.style.display = "block");
document.getElementById("minutos"+numero).disabled = true;
document.getElementById("config"+numero).style.display = "none";

atualizarResumo();
salvarDados();

document.getElementById("tempo"+numero).textContent =
`${Math.floor(segundos/60)}:${(segundos%60).toString().padStart(2,"0")}`;

contadores[numero] = setInterval(function(){


segundos = Math.ceil(
    (fimContagem[numero] - Date.now()) / 1000
);

let min = Math.floor(segundos / 60);
let seg = segundos % 60;

document.getElementById("tempo"+numero).textContent =
`${min}:${seg.toString().padStart(2,"0")}`;

salvarDados();
horariosContagem[numero] = Date.now();
salvarDados();

if(segundos <= 60){
    document.getElementById("tempo"+numero).classList.add("alerta");
}else{
    document.getElementById("tempo"+numero).classList.remove("alerta");
}

if(segundos <= 0){

    clearInterval(contadores[numero]);

    alarme.currentTime = 0;
    alarme.play();

    delete fimContagem[numero];

    interromper(numero);

}

},1000);

}

function pausar(numero){

    clearInterval(contadores[numero]);

    if(fimContagem[numero]){
        tempoPausado[numero] =
            fimContagem[numero] - Date.now();

        delete fimContagem[numero];
    }

    document.getElementById("status"+numero).innerHTML="⏸️ Pausado";
    document.getElementById("status"+numero).className="alugado";
    document.getElementById("card"+numero).className="card card-pausado";

    document.getElementById("btnPausar"+numero).style.display="none";
    document.getElementById("btnRetomar"+numero).style.display="block";
    document.getElementById("btnEncerrar"+numero).style.display="block";

    atualizarResumo();
    salvarDados();

}

function retomar(numero){

    if(tempoPausado[numero]){

        fimContagem[numero] =
            Date.now() + tempoPausado[numero];

        delete tempoPausado[numero];
    }

    document.getElementById("status"+numero).innerHTML="🔴 Alugado";
    document.getElementById("status"+numero).className="alugado";
    document.getElementById("card"+numero).className="card card-alugado";

    document.getElementById("btnRetomar"+numero).style.display="none";
    document.getElementById("btnPausar"+numero).style.display="block";
    document.getElementById("btnEncerrar"+numero).style.display="block";

    alugar(numero);

    atualizarResumo();
    salvarDados();

}

function interromper(numero){

    clearInterval(contadores[numero]);

    document.getElementById("status"+numero).innerHTML="🟢 Disponível";
    document.getElementById("status"+numero).className="disponivel";
    document.getElementById("card"+numero).className="card card-disponivel";

    document.getElementById("tempo"+numero).innerHTML="";
    document.getElementById("tempo"+numero).classList.remove("alerta");
    document.getElementById("inicio"+numero).innerHTML="";

    document.getElementById("minutos"+numero).disabled=false;

    document.getElementById("btnIniciar"+numero).style.display="block";
    document.getElementById("btnPausar"+numero).style.display="none";
    document.getElementById("btnRetomar"+numero).style.display="none";
    document.getElementById("btnEncerrar"+numero).style.display="none";

    document.getElementById("tempo"+numero).style.display="none";
    document.getElementById("inicio"+numero).style.display="none";

    document.querySelectorAll("#card"+numero+" .linha")
        .forEach(linha=>linha.style.display="none");

    document.getElementById("config"+numero).style.display="block";

const fim = new Date();
const inicio = horariosInicio[numero];

if(inicio){

    const linha = document.createElement("tr");

    linha.innerHTML=`
        <td style="text-align:center;">${numero}</td>
        <td style="text-align:center;">
            ${inicio.getHours().toString().padStart(2,"0")}:
            ${inicio.getMinutes().toString().padStart(2,"0")}
        </td>
        <td style="text-align:center;">
            ${fim.getHours().toString().padStart(2,"0")}:
            ${fim.getMinutes().toString().padStart(2,"0")}
        </td>
        <td style="text-align:center;">
            ${document.getElementById("minutos"+numero).value} min
        </td>
        <td style="text-align:center;">
            R$ ${document.getElementById("minutos"+numero).value},00
        </td>
    `;

    document.querySelector("#historico tbody").prepend(linha);
}

delete horariosInicio[numero];
delete fimContagem[numero];
delete tempoPausado[numero];

atualizarResumo();
salvarDados();

}

function salvarDados(){

    localStorage.setItem("fimContagem", JSON.stringify(fimContagem));

    localStorage.setItem("tempoPausado", JSON.stringify(tempoPausado));

    localStorage.setItem("horariosInicio", JSON.stringify(horariosInicio));

    localStorage.setItem(
        "historico",
        document.getElementById("historico").innerHTML
    );

}
function atualizarResumo(){

    let disponivel = 0;
    let alugado = 0;
    let pausado = 0;

    for(let i=1;i<=5;i++){

        const texto = document.getElementById("status"+i).innerHTML;

        if(texto.includes("Disponível")){
            disponivel++;
        }

        else if(texto.includes("Pausado")){
            pausado++;
        }

        else{
            alugado++;
        }

    }

if(document.getElementById("qtdDisponivel")){
    document.getElementById("qtdDisponivel").innerHTML = disponivel;
    document.getElementById("qtdAlugado").innerHTML = alugado;
    document.getElementById("qtdPausado").innerHTML = pausado;
}

}

const fimSalvo = JSON.parse(localStorage.getItem("fimContagem") || "{}");
const pausaSalva = JSON.parse(localStorage.getItem("tempoPausado") || "{}");
const inicioSalvo = JSON.parse(localStorage.getItem("horariosInicio") || "{}");
const historicoSalvo = localStorage.getItem("historico");

fimContagem = fimSalvo;
tempoPausado = pausaSalva;
horariosInicio = inicioSalvo;

if(historicoSalvo){
    document.getElementById("historico").innerHTML = historicoSalvo;
}

for(let i=1;i<=5;i++){

    if(fimContagem[i]){

        if(Date.now() >= fimContagem[i]){

            interromper(i);

        }else{

            alugar(i);

        }

    }else if(tempoPausado[i]){

        document.getElementById("status"+i).innerHTML="⏸️ Pausado";
        document.getElementById("status"+i).className="alugado";
        document.getElementById("card"+i).className="card card-pausado";

        document.getElementById("btnIniciar"+i).style.display="none";
        document.getElementById("btnPausar"+i).style.display="none";
        document.getElementById("btnRetomar"+i).style.display="block";
        document.getElementById("btnEncerrar"+i).style.display="block";

        document.getElementById("tempo"+i).style.display="block";
        document.getElementById("inicio"+i).style.display="block";
        document.getElementById("config"+i).style.display="none";
        document.getElementById("minutos"+i).disabled=true;

    }

}

atualizarResumo();

</body>
</html>
