<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Painel Administrativo - Asa Kids</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f2f5f9;
color:#222;
padding-bottom:40px;
}

/*==========================
CABEÇALHO
==========================*/

header{

background:#0b2343;

color:white;

padding:20px;

border-bottom:5px solid #ffcc00;

display:flex;

justify-content:space-between;

align-items:center;

}

header h1{

font-size:22px;

}

header p{

font-size:14px;

opacity:.9;

margin-top:4px;

}

header img{

width:65px;

height:65px;

object-fit:contain;

}

/*==========================
MENU
==========================*/

.menu{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

padding:18px;

}

.menu button{

background:white;

border:none;

border-radius:18px;

padding:18px;

font-size:18px;

font-weight:bold;

box-shadow:0 6px 18px rgba(0,0,0,.12);

cursor:pointer;

transition:.3s;

}

.menu button:hover{

transform:translateY(-2px);

}

.menu button.ativo{

background:#ffcc00;

}

/*==========================
CONTEÚDO
==========================*/

.tela{

display:none;

padding:18px;

animation:fade .3s;

}

.tela.ativa{

display:block;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(10px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/*==========================
CARDS
==========================*/

.card{

background:white;

border-radius:20px;

padding:20px;

margin-bottom:16px;

box-shadow:0 6px 18px rgba(0,0,0,.08);

}

.card h2{

font-size:18px;

margin-bottom:8px;

}

.numero{

font-size:34px;

font-weight:bold;

margin-top:5px;

}

.azul{

border-left:8px solid #2563eb;

}

.verde{

border-left:8px solid #16a34a;

}

.vermelho{

border-left:8px solid #dc2626;

}

.amarelo{

border-left:8px solid #f59e0b;

}

.itemHistorico{

background:white;

border-radius:18px;

padding:18px;

margin-bottom:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

line-height:1.8;

}

.config button{

width:100%;

padding:16px;

margin-bottom:12px;

font-size:18px;

border:none;

border-radius:15px;

background:#0b2343;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<header>

<div>

<h1>Painel Administrativo</h1>

<p>Asa Kids</p>

</div>

<img src="logo1.png">

</header>

<div class="menu">

<button class="ativo"
onclick="abrirTela('dashboard',this)">
📊 Dashboard
</button>

<button
onclick="abrirTela('historico',this)">
📋 Histórico
</button>

<button
onclick="abrirTela('financeiro',this)">
💰 Financeiro
</button>

<button
onclick="abrirTela('config',this)">
⚙️ Configurações
</button>

</div>

<!-- =========================
DASHBOARD
========================= -->

<div id="dashboard" class="tela ativa">

<h2 style="margin-bottom:20px;">
👋 Bem-vindo!
</h2>

<div class="card vermelho">
<h2>🚲 Em uso</h2>
<div class="numero" id="emUso">0</div>
</div>

<div class="card verde">
<h2>✅ Disponíveis</h2>
<div class="numero" id="disponiveis">0</div>
</div>

<div class="card azul">
<h2>📋 Aluguéis Hoje</h2>
<div class="numero" id="alugueisHoje">0</div>
</div>

<div class="card amarelo">
<h2>💰 Total Hoje</h2>
<div class="numero" id="valorHoje">
R$ 0,00
</div>
</div>

<div class="card">

<h2>🚲 Status dos Triciclos</h2>

<div id="statusTriciclos"></div>

</div>

</div>

<!-- =========================
HISTÓRICO
========================= -->

<div id="historico" class="tela">

<h2 style="margin-bottom:20px;">
📋 Histórico
</h2>

<div id="listaHistorico">

<p style="text-align:center;color:#777;">
Nenhum aluguel registrado.
</p>

</div>

</div>

<!-- =========================
FINANCEIRO
========================= -->

<div id="financeiro" class="tela">

<h2 style="margin-bottom:20px;">
💰 Financeiro
</h2>

<div class="card amarelo">

<h2>Hoje</h2>

<div class="numero" id="financeiroHoje">

R$ 0,00

</div>

</div>

<div class="card azul">

<h2>Semana</h2>

<div class="numero" id="financeiroSemana">

R$ 0,00

</div>

</div>

<div class="card verde">

<h2>Mês</h2>

<div class="numero" id="financeiroMes">

R$ 0,00

</div>

</div>

</div>

<!-- =========================
CONFIGURAÇÕES
========================= -->

<div id="config" class="tela config">

<h2 style="margin-bottom:20px;">
⚙️ Configurações
</h2>

<button onclick="limparHistorico()">
🗑️ Limpar Histórico
</button>

<button onclick="logout()">
🚪 Sair
</button>

</div>



<script>

function abrirTela(id, botao){

document.querySelectorAll(".tela").forEach(function(tela){
tela.classList.remove("ativa");
});

document.getElementById(id).classList.add("ativa");

document.querySelectorAll(".menu button").forEach(function(btn){
btn.classList.remove("ativo");
});

botao.classList.add("ativo");

}

function carregarHistorico(){

let historico = JSON.parse(localStorage.getItem("historico")) || [];

let lista = document.getElementById("listaHistorico");

lista.innerHTML = "";

if(historico.length==0){

lista.innerHTML="<p style='text-align:center;color:#777;'>Nenhum aluguel registrado.</p>";

return;

}

historico.slice().reverse().forEach(function(item){

lista.innerHTML += `

<div class="itemHistorico">

<b>🚲 Triciclo:</b> ${item.triciclo}<br>

<b>📅 Data:</b> ${item.data}<br>

<b>🕒 Hora:</b> ${item.hora}<br>

<b>⏱ Tempo:</b> ${item.tempo}<br>

<b>💰 Valor:</b> ${item.valor}

</div>

`;

});

}

function atualizarDashboard(){

let historico = JSON.parse(localStorage.getItem("historico")) || [];

document.getElementById("alugueisHoje").textContent = historico.length;

let total = 0;

historico.forEach(function(item){

let valor = parseFloat(

item.valor
.replace("R$","")
.replace(",",".")
.trim()

);

if(!isNaN(valor)){

total += valor;

}

});

document.getElementById("valorHoje").textContent="R$ "+total.toFixed(2).replace(".",",");

document.getElementById("financeiroHoje").textContent="R$ "+total.toFixed(2).replace(".",",");

document.getElementById("financeiroSemana").textContent="R$ "+total.toFixed(2).replace(".",",");

document.getElementById("financeiroMes").textContent="R$ "+total.toFixed(2).replace(".",",");

}

function limparHistorico(){

if(confirm("Deseja realmente apagar todo o histórico?")){

localStorage.removeItem("historico");

carregarHistorico();

atualizarDashboard();

}

}

function logout(){

window.location.href="login.html";

}

function desenharTriciclos(){

    const lista=document.getElementById("statusTriciclos");
    lista.innerHTML="";

    const historico=JSON.parse(localStorage.getItem("historico"))||[];

    const ativos={};

    historico.forEach(item=>{

        ativos[item.triciclo]=item;

    });


   for(let i=1;i<=5;i++){

    let item = ativos[i];
    if(item){



            let hora=item.hora.split(":");

            let inicio=new Date();

            inicio.setHours(parseInt(hora[0]));
            inicio.setMinutes(parseInt(hora[1]));
            inicio.setSeconds(0);

            let minutos=parseInt(item.tempo);

            let fim=new Date(inicio.getTime()+minutos*60000);

            let agora=new Date();

            let restante=Math.floor((fim-agora)/60000);

            let cor="#16a34a";
            let texto="🟢 Livre";

            if(restante>10){

                cor="#16a34a";
                texto="🟢 "+restante+" min restantes";

            }else if(restante>0){

                cor="#f59e0b";
                texto="🟡 "+restante+" min restantes";

            }else{

                cor="#dc2626";
                texto="🔴 TEMPO ESGOTADO";

            }

            lista.innerHTML+=`

            <div style="
            background:white;
            border-left:8px solid ${cor};
            border-radius:15px;
            padding:15px;
            margin-top:12px;
            ">

            <div style="display:flex;justify-content:space-between;">

            <b>🚲 Triciclo ${i}</b>

            <span style="color:${cor};font-weight:bold;">

            ${texto}

            </span>

            </div>

            <div style="margin-top:8px;">
            💰 ${item.valor}
            </div>

            <div>
            ⏱ ${item.tempo}
            </div>

            <div>
            🕒 ${item.hora}
            </div>

            </div>

            `;

            
        }else{

            lista.innerHTML+=`

            <div style="
            background:#e8f5e9;
            border-left:8px solid #16a34a;
            border-radius:15px;
            padding:15px;
            margin-top:12px;
            display:flex;
            justify-content:space-between;
            ">

            <b>🚲 Triciclo ${i}</b>

            <span style="color:#16a34a;font-weight:bold;">

            Livre

            </span>

            </div>

            `;

        }

    }

}

    


function atualizarStatus(){

    const fimContagem = JSON.parse(localStorage.getItem("fimContagem")) || {};

    const totalTriciclos = 5;

    let usados = 0;

    for(let i=1;i<=5;i++){
        if(fimContagem[i]){
            usados++;
        }
    }

    document.getElementById("emUso").textContent = usados;
    document.getElementById("disponiveis").textContent = totalTriciclos - usados;

}

window.onload = function(){

    carregarHistorico();
    atualizarDashboard();
    atualizarStatus();
    desenharTriciclos();

}

window.onload = function(){

    carregarHistorico();

    atualizarDashboard();

    atualizarStatus();

    desenharTriciclos();

}

setInterval(function(){

    desenharTriciclos();

    atualizarStatus();

},1000);

</script>

</body>
</html>
